<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tensoratech — Consultation gratuite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Tensoratech</h1>
            <p class="subtitle">
                AI Automation + SEO pour les PMEs
                à Dubai et Abu Dhabi
            </p>
        </div>

        <div class="card">
            <h2>Demandez votre consultation gratuite</h2>
            <p class="card-subtitle">
                Notre équipe vous contacte sous 24h.
            </p>

            <form id="lead-form">

                <div class="field">
                    <label for="name">Nom complet *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ahmed Al Mansouri"
                        required
                    />
                </div>

                <div class="field">
                    <label for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ahmed@company.com"
                        required
                    />
                </div>

                <div class="field">
                    <label for="phone">Téléphone</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+971 50 123 4567"
                    />
                </div>

                <div class="field">
                    <label for="message">Votre besoin</label>
                    <textarea
                        id="message"
                        name="message"
                        placeholder="Décrivez votre projet..."
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit" id="submit-btn">
                    Envoyer ma demande
                </button>

                <div id="msg" class="msg hidden"></div>

            </form>
        </div>

    </div>

    <script src="form.js"></script>
</body>
</html>
