services:
  postgres:
    image: postgres: 16
    environment:
      POSTGRES_DB: tensoratech_leads
      POSTGRES_USER: admin
      POSTGRES_PASSWORD : secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:                          # volume nommé — les données survivent aux redémarrages